name: Build Pebble

on:
  workflow_dispatch:
    inputs:
      pebble-version:
        description: Pebble version
        required: true
        default: "2.10.1"

permissions:
  contents: read
  packages: write

  
jobs:
  build-pebble:
    name: Build Pebble Containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Pebble EAB
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/pebble/Dockerfile
          build-args: |
            CONFIG=pebble-config-eab.json
          push: true
          tags: ghcr.io/${{ github.repository }}/pebble-eab:${{ inputs.pebble-version }}

      - name: Build Pebble non-EAB
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/pebble/Dockerfile
          build-args: |
            CONFIG=pebble-config-no-eab.json
          push: true
          tags: ghcr.io/${{ github.repository }}/pebble-no-eab:${{ inputs.pebble-version }}