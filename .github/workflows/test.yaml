name: Run PHP HTTP test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: php:8.3-cli-alpine

    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        command: -strict -dnsserver challtestsrv:8053
        ports:
          - 14000:14000 # HTTPS ACME API
      challtestsrv:
        image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
        command: -defaultIPv6 "" -defaultIPv4 127.0.0.1
        ports:
          - 8055:8055 # HTTP Management API
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Wait for services
        run: |
          until wget -q --spider http://pebble:14000/dir; do
            echo "Waiting for Pebble..."
            sleep 1
          done

          until wget -q --spider http://challtestsrv:8055/; do
            echo "Waiting for challtestsrv..."
            sleep 1
          done

          echo "Services are ready!"

      - name: Create Pebble certificate
