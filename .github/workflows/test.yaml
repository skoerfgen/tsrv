name: ACMECert Test Runner


on:
  workflow_dispatch:
  pull_request:
  #push:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        version: [8.3,8.5]
        #os: [ubuntu-latest, windows-latest]

    runs-on: ubuntu-latest
    name: php${{ matrix.version }}-cli-alpine test
    container:
      image: php:${{ matrix.version }}-cli-alpine

    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        command: -strict -dnsserver challtestsrv:8053
        ports:
          - 14000:14000 # HTTPS ACME API
        env:
          PEBBLE_WFE_NONCEREJECT: "0"
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_AUTHZREUSE: "0"
      challtestsrv:
        image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
        command: -defaultIPv6 "" -defaultIPv4 "127.0.0.1"
        ports:
          - 8055:8055 # HTTP Management API
          - 8053:8053 # DNS
          - 5002:5002 # HTTP-01
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        
      - name: Create Pebble certificate
        run: |
          cat > pebble.crt << 'EOF'
          -----BEGIN CERTIFICATE-----
          MIIDPzCCAiegAwIBAgIIU0Xm9UFdQxUwDQYJKoZIhvcNAQELBQAwIDEeMBwGA1UE
          AxMVbWluaWNhIHJvb3QgY2EgNTM0NWU2MCAXDTI1MDkwMzIzNDAwNVoYDzIxMjUw
          OTAzMjM0MDA1WjAgMR4wHAYDVQQDExVtaW5pY2Egcm9vdCBjYSA1MzQ1ZTYwggEi
          MA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQC5WgZNoVJandj43kkLyU50vzCZ
          alozvdRo3OFiKoDtmqKPNWRNO2hC9AUNxTDJco51Yc42u/WV3fPbbhSznTiOOVtn
          Ajm6iq4I5nZYltGGZetGDOQWr78y2gWY+SG078MuOO2hyDIiKtVc3xiXYA+8Hluu
          9F8KbqSS1h55yxZ9b87eKR+B0zu2ahzBCIHKmKWgc6N13l7aDxxY3D6uq8gtJRU0
          toumyLbdzGcupVvjbjDP11nl07RESDWBLG1/g3ktJvqIa4BWgU2HMh4rND6y8OD3
          Hy3H8MY6CElL+MOCbFJjWqhtOxeFyZZV9q3kYnk9CAuQJKMEGuN4GU6tzhW1AgMB
          AAGjezB5MA4GA1UdDwEB/wQEAwIChDATBgNVHSUEDDAKBggrBgEFBQcDATASBgNV
          HRMBAf8ECDAGAQH/AgEAMB0GA1UdDgQWBBSu8RGpErgYUoYnQuwCq+/ggTiEjDAf
          BgNVHSMEGDAWgBSu8RGpErgYUoYnQuwCq+/ggTiEjDANBgkqhkiG9w0BAQsFAAOC
          AQEAXDVYov1+f6EL7S41LhYQkEX/GyNNzsEvqxE9U0+3Iri5JfkcNOiA9O9L6Z+Y
          bqcsXV93s3vi4r4WSWuc//wHyJYrVe5+tK4nlFpbJOvfBUtnoBDyKNxXzZCxFJVh
          f9uc8UejRfQMFbDbhWY/x83y9BDufJHHq32OjCIN7gp2UR8rnfYvlz7Zg4qkJBsn
          DG4dwd+pRTCFWJOVIG0JoNhK3ZmE7oJ1N4H38XkZ31NPcMksKxpsLLIS9+mosZtg
          4olL7tMPJklx5ZaeMFaKRDq4Gdxkbw4+O4vRgNm3Z8AXWKknOdfgdpqLUPPhRcP4
          v1lhy71EhBuXXwRQJry0lTdF+w==
          -----END CERTIFICATE-----
          EOF
          
      - name: Wait for services
        run: |
          until wget --no-check-certificate -q --spider https://pebble:14000/dir; do
            echo "Waiting for Pebble..."
            sleep 1
          done
          echo "Pebble ready!"


      - name: Get challtestsrv IP
        run: |
          PEBBLE_IP=$(getent hosts challtestsrv | awk '{ print $1 }')
          echo "Pebble IP: $PEBBLE_IP"

          curl -s -H 'Content-Type: application/json' \
            -d "$(printf '{"ip":"%s"}' "$PEBBLE_IP")" \
            http://challtestsrv:8055/set-default-ipv4
         
      - name: Run test.php
        run: php -d curl.cainfo=pebble.crt -d openssl.cafile=pebble.crt test/test.php
        
  test-required:
    name: AllTests
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Check test matrix
        if: ${{ needs.test.result != 'success' }}
        run: exit 1

      - run: echo "All tests passed"        