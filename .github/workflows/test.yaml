name: ACMECert Test

on:
  workflow_dispatch:
  #pull_request:
  push:
  
permissions:
  contents: read


jobs:
  test:
    needs: [build-pebble,setup]
    strategy:
      fail-fast: false
      matrix:
        version: ['5.6','7.0','7.4','8.0','8.5']
        #version: ['8.5']
        #os: [ubuntu-latest, windows-latest]

    runs-on: ubuntu-latest
    name: PHP ${{ matrix.version }}
    container:
      image: php:${{ matrix.version }}-cli-alpine
    services:

      pebble:
        image: ghcr.io/${{ github.repository }}/pebble-no-eab:${{ needs.setup.outputs.pebble-version }}
        command: -strict -dnsserver challtestsrv:8053
        env:
          PEBBLE_WFE_NONCEREJECT: 0
          PEBBLE_VA_NOSLEEP: 1
          PEBBLE_AUTHZREUSE: 100
          
      pebble-eab:
        image: ghcr.io/${{ github.repository }}/pebble-eab:${{ needs.setup.outputs.pebble-version }}
        command: -strict -dnsserver challtestsrv:8053
        env:
          PEBBLE_WFE_NONCEREJECT: 0
          PEBBLE_VA_NOSLEEP: 1
          PEBBLE_AUTHZREUSE: 100
          
      challtestsrv:
        image: ghcr.io/letsencrypt/pebble-challtestsrv:${{ needs.setup.outputs.pebble-version }}
        command: -defaultIPv6 "" -defaultIPv4 "127.0.0.1" -tlsalpn01 ""

    steps:
      #- name: Checkout@v7
      #  if: matrix.version != '5.6'
      #  uses: actions/checkout@v7
        
      - name: Install dependencies
        #if: matrix.version == '5.6'
        run: |
          command -v git >/dev/null 2>&1 || apk add --no-cache git nodejs socat
          
      - name: Git checkout commit
        #if: matrix.version == '5.6'
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          
      #- name: Wait for Pebble to startup
      #  run: |
      #    until wget --no-check-certificate -q --spider https://pebble:14000/dir; do
      #      echo "Waiting for Pebble..."
      #      sleep 1
      #    done
      #    echo "Pebble ready!"

      #- name: Set challtestsrv IP
      #  run: |
      #    C_IP=$(getent hosts challtestsrv | awk '{ print $1 }')
      #    echo "challtestsrv IP: $C_IP"
      #
      #    curl -s -H 'Content-Type: application/json' \
      #      -d "$(printf '{"ip":"%s"}' "$C_IP")" \
      #      http://challtestsrv:8055/set-default-ipv4
      - name: Create Pebble CA certificate
        run: |
          cat > pebble.crt << 'EOF'
          -----BEGIN CERTIFICATE-----
          MIIDPzCCAiegAwIBAgIIU0Xm9UFdQxUwDQYJKoZIhvcNAQELBQAwIDEeMBwGA1UE
          AxMVbWluaWNhIHJvb3QgY2EgNTM0NWU2MCAXDTI1MDkwMzIzNDAwNVoYDzIxMjUw
          OTAzMjM0MDA1WjAgMR4wHAYDVQQDExVtaW5pY2Egcm9vdCBjYSA1MzQ1ZTYwggEi
          MA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQC5WgZNoVJandj43kkLyU50vzCZ
          alozvdRo3OFiKoDtmqKPNWRNO2hC9AUNxTDJco51Yc42u/WV3fPbbhSznTiOOVtn
          Ajm6iq4I5nZYltGGZetGDOQWr78y2gWY+SG078MuOO2hyDIiKtVc3xiXYA+8Hluu
          9F8KbqSS1h55yxZ9b87eKR+B0zu2ahzBCIHKmKWgc6N13l7aDxxY3D6uq8gtJRU0
          toumyLbdzGcupVvjbjDP11nl07RESDWBLG1/g3ktJvqIa4BWgU2HMh4rND6y8OD3
          Hy3H8MY6CElL+MOCbFJjWqhtOxeFyZZV9q3kYnk9CAuQJKMEGuN4GU6tzhW1AgMB
          AAGjezB5MA4GA1UdDwEB/wQEAwIChDATBgNVHSUEDDAKBggrBgEFBQcDATASBgNV
          HRMBAf8ECDAGAQH/AgEAMB0GA1UdDgQWBBSu8RGpErgYUoYnQuwCq+/ggTiEjDAf
          BgNVHSMEGDAWgBSu8RGpErgYUoYnQuwCq+/ggTiEjDANBgkqhkiG9w0BAQsFAAOC
          AQEAXDVYov1+f6EL7S41LhYQkEX/GyNNzsEvqxE9U0+3Iri5JfkcNOiA9O9L6Z+Y
          bqcsXV93s3vi4r4WSWuc//wHyJYrVe5+tK4nlFpbJOvfBUtnoBDyKNxXzZCxFJVh
          f9uc8UejRfQMFbDbhWY/x83y9BDufJHHq32OjCIN7gp2UR8rnfYvlz7Zg4qkJBsn
          DG4dwd+pRTCFWJOVIG0JoNhK3ZmE7oJ1N4H38XkZ31NPcMksKxpsLLIS9+mosZtg
