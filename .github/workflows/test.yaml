name: ACMECert Test

on:
  workflow_dispatch:
  #pull_request:
  push:
  
permissions:
  contents: read

jobs:
  test-required:
    name: All Tests
    if: always()
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Check test matrix
        if: ${{ needs.test.result != 'success' }}
        run: exit 1

      - run: echo "All tests passed"
  test:
    strategy:
      fail-fast: false
      matrix:
        version: ['5.6','7.0','7.4','8.0','8.5']
        #version: ['8.5']
        #os: [ubuntu-latest, windows-latest]

    runs-on: ubuntu-latest
    name: PHP ${{ matrix.version }}
    container:
      image: php:${{ matrix.version }}-cli-alpine
    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        command: -strict -dnsserver challtestsrv:8053
        ports:
          - 14000:14000 # HTTPS ACME API
        env:
          PEBBLE_WFE_NONCEREJECT: "0"
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_AUTHZREUSE: "0"
      challtestsrv:
        image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
        command: -defaultIPv6 "" -defaultIPv4 "127.0.0.1" -tlsalpn01 ""
        ports:
          #- 8055:8055 # HTTP Management API
          - 8053:8053 # DNS
          - 5002:5002 # HTTP-01
    steps:
      #- name: Checkout@v7
      #  if: matrix.version != '5.6'
      #  uses: actions/checkout@v7
        
      - name: Git Checkout + NodeJS install
        #if: matrix.version == '5.6'
        run: |
          command -v git >/dev/null 2>&1 || apk add --no-cache git nodejs socat
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git init
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          
      - name: Wait for Pebble to startup
        run: |
          until wget --no-check-certificate -q --spider https://pebble:14000/dir; do
            echo "Waiting for Pebble..."
            sleep 1
          done
          echo "Pebble ready!"

      #- name: Set challtestsrv IP
      #  run: |
      #    C_IP=$(getent hosts challtestsrv | awk '{ print $1 }')
      #    echo "challtestsrv IP: $C_IP"
      #
      #    curl -s -H 'Content-Type: application/json' \
      #      -d "$(printf '{"ip":"%s"}' "$C_IP")" \
      #      http://challtestsrv:8055/set-default-ipv4

